			<h3>Gebruikers</h3>

                <div class="js-item is-idle" data-id="1">
                    <button type="button" class="list__item collapsible" onclick="foldOpen(event)">Aanmaken
						<svg xmlns="http://www.w3.org/2000/svg" id="colapse-btn" viewBox="0 0 16 16">
							<path d="M10 8H9V4.8198L5.15728 4.05126C4.98683 4.01717 4.81343 4 4.63961 4C3.18179 4 2 5.18179 2 6.63961V9H0V6.63961C0 4.07722 2.07722 2 4.63961 2C4.94514 2 5.24992 2.03018 5.54951 2.0901L9 2.7802V0H10L14 4L10 8Z"/>

                        <div class="handle" style="display: none;">
                            <input type="checkbox" class="js-visibility-checkbox" checked>
                            <div class="js-child-toggle child-toggle"></div>
                            <div class="js-drag-handle drag-handle"></div>
                        </div>
                    </button> 
                    <div class="js-child" id="createUser">
						<form action="/php/users.php" method="POST"> 
							<div class="userForm">
								<input type="text" id="action" value="add" name="action" style="display:none;">
								<label for="username"><b>Gebruikersnaam</b></label>
								<input type="text" id="username-form" placeholder="Vul gebruikersnaam in" name="username" required>
								
								<label for="firstname"><b>Voornaam</b></label>
								<input type="text" id="firstname-form" placeholder="Vul voornaam in" name="firstname" required>
								
								<label for="lastname"><b>Achternaam</b></label>
								<input type="text" id="lastname-form" placeholder="Vul achternaam in" name="lastname" required>
								
								<label for="role"><b>Rol</b></label>
								<!-- <input type="text" id="role-form" placeholder="Vul rol in" name="role" required> -->
								<select name="role" id="role-form" placeholder="Kies rol" required>
									<option value="user">User</option>
									<option value="admin">Admin</option>
								</select>
								
								<label for="password"><b>Wachtwoord</b></label>
								<input type="password" id="password-form" placeholder="Vul wachtwoord in" autocomplete="password" name="password" required>
								<i class="bi bi-eye-slash" id="togglePassword"></i>
							</div>
							<div class="userctl">
								<button type="submit" class="userbtn" name="userbtn">Invoeren</button>
							</div>
						</form>
					</div>					
                </div>
				<div class="js-item is-idle" id="editUserBlock" data-id="2">
                    <button type="button" class="list__item collapsible" onclick="foldOpen(event)">Bewerken
						<svg xmlns="http://www.w3.org/2000/svg" id="colapse-btn" viewBox="0 0 16 16">
							<path d="M10 8H9V4.8198L5.15728 4.05126C4.98683 4.01717 4.81343 4 4.63961 4C3.18179 4 2 5.18179 2 6.63961V9H0V6.63961C0 4.07722 2.07722 2 4.63961 2C4.94514 2 5.24992 2.03018 5.54951 2.0901L9 2.7802V0H10L14 4L10 8Z"/>

						</svg>

                        <div class="handle" style="display: none;">
                            <input type="checkbox" class="js-visibility-checkbox" checked>
                            <div class="js-child-toggle child-toggle"></div>
                            <div class="js-drag-handle drag-handle"></div>
                        </div>
                    </button>
                    <div class="js-child" style="padding: 1em 0em 0em 0em;">
						<div id="user-switch-section">
							<p>Alleen deelnemende gebruikers</p>
							<label class="switch">
								<input type="checkbox" id="active-user-box"/>
								<span class="slider round"></span>
							</label>  
						</div>
						<hr>
						<div id="editUser"></div>
					</div>	
				</div>
			</div>
