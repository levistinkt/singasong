<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <meta http-equiv="X-UA-Compatible" content="ie=edge">
        <title>Sing a song</title>
        <link type="text/css" href="/css/index.css" rel="stylesheet">
		<link type="text/css" href="/css/Rolldate.css" rel="stylesheet">
		<link type="text/css" href="/css/settings.css" rel="stylesheet">
        <link rel="icon" type="image/x-icon" href="/img/icons/favicon.ico">
        <link rel="manifest" href="/manifest.json">

    <body>
        <div id="topper"></div>
        <main>
			<img id="img-bg" src="/img/logo.png">
			<div id="media"></div>
            <h3>Instellingen</h3>
            <div class="js-list">
                <div class="js-item is-idle" data-id="1">
                    <button type="button" class="list__item collapsible" onclick="foldOpen(event)">Kleuren

						</svg>

                        <div class="handle" style="display: none;">
                            <input type="checkbox" class="js-visibility-checkbox" checked>
                            <div class="js-child-toggle child-toggle"></div>
                            <div class="js-drag-handle drag-handle"></div>
                        </div>
                    </button>
                    <div class="js-child last-searches-widget" style="display:none">
                        <div id="theme">
                            <p id="kop">Thema</p>
                            <div id="theme-picker-section" class="theme-section">      
                                <input type="radio" name="theme" value="cyan">
                                <input type="radio" name="theme" value="purple">
                                <input type="radio" name="theme" value="violet">
                                <input type="radio" name="theme" value="indigo">
                                <input type="radio" name="theme" value="black">

                            </div>
                            <div id="theme-picker-section" class="theme-section">      
                                <input type="radio" name="theme" value="red">
                                <input type="radio" name="theme" value="orange">
                                <input type="radio" name="theme" value="yellow">
                                <input type="radio" name="theme" value="green">
                                <input type="radio" name="theme" value="blue">
                            </div>
                        </div>
                        <hr>
                        <div id="modus">
                            <p id="kop">Donkere modus</p>
                            <div id="mode">
                                <p>Aan / Uit</p>
                                <div id="switch-section">
                                    <label class="switch">
                                        <input type="checkbox" id="themebox"/>
                                        <span class="slider round"></span>
                                    </label>  
                                </div>
                            </div>
                        </div>
                    </div>     
                </div>
                <div class="js-item is-idle" data-id="2">
                    <button type="button" class="list__item collapsible" onclick="foldOpen(event)">Lettertype
						<svg xmlns="http://www.w3.org/2000/svg" id="colapse-btn" viewBox="0 0 16 16">
							<path d="M10 8H9V4.8198L5.15728 4.05126C4.98683 4.01717 4.81343 4 4.63961 4C3.18179 4 2 5.18179 2 6.63961V9H0V6.63961C0 4.07722 2.07722 2 4.63961 2C4.94514 2 5.24992 2.03018 5.54951 2.0901L9 2.7802V0H10L14 4L10 8Z"/>

                            <input type="checkbox" class="js-visibility-checkbox" checked>
                            <div class="js-child-toggle child-toggle"></div>
                            <div class="js-drag-handle drag-handle"></div>
                        </div>
                    </button>
                     <div class="js-child last-searches-widget" style="display:none">
                        <div id="fsize">
                            <p id="kop">Letter grootte</p>
                            <div id="font-size-wrapper">
                                <input type="button" id="font-down-btn" value="&#8681;">
                                <input type="button" id="font-up-btn" value="&#8679;">
                            </div>
                        </div>
                        <hr>
                        <div id="ftype">
                            <p id="kop">Letter type</p>
                            <div id="font-type-wrapper">    
                                <div id="font-picker-section"> 
                                    <input type="radio" id="Arial" name="font" value="arial">
                                    <label for="Arial" style="font-family:Arial, sans-serif">Sing a Song is the best !</label><br>
                                    <input type="radio" id="Brush "name="font" value="brush">
                                    <label for="Bursh" style="font-family:Brush Script MT, cursive">Sing a Song is the best !</label><br>
                                    <input type="radio" id="Courier" name="font" value="times">
                                    <label for="Times" style="font-family:Times New Roman, serif">Sing a Song is the best !</label><br>
                                    <input type="radio" id="Comic" name="font" value="courier">
                                    <label for="Comic" style="font-family:Courier New, monospacef">Sing a Song is the best !</label><br>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>

									</svg>      
                                </div>
                            </div>
                        </div>
                        <hr>
                        <div id="menu_pos">
                            <p id="kop">Verwissel topbalk met bodembalk</p>
                            <div id="vertical-pos">
                                <p>Flip verticaal</p>
                                <div id="vertical-wrapper">
									<svg xmlns="http://www.w3.org/2000/svg" id="ver-btn" viewBox="0 0 24 24" fill="none">

                </div>

			<div id="settings-controls">

			</div>
			<div id="bgMenuOverlay"></div>
			<div id="bgMediaOverlay"></div>
